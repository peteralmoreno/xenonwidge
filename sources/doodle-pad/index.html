<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tr('Doodle Pad')</title>
  <link rel="icon" type="image/svg+xml" href="resources/icon.svg" />
  <link rel="stylesheet" href="styles/widget.css" />
  <script src="scripts/core.js" defer="defer"></script>
  <script src="scripts/drawing.js" defer="defer"></script>
  <script src="scripts/picker.js" defer="defer"></script>
  <script src="scripts/host.js" defer="defer"></script>
  <script src="scripts/app.js" defer="defer"></script>
</head>
<body>
  <main class="pad">
    <header class="topbar">
      <div class="brand"><img src="resources/icon.svg" alt="" width="30" height="30"><h1>Doodle Pad</h1></div>
      <nav class="file-actions" aria-label="Images">
        <button id="copy" type="button">Copy</button>
        <button id="paste" type="button">Paste</button>
        <button id="import" type="button" title="Open a PNG, JPEG or WebP image">Open image</button>
        <button id="save" type="button" class="primary">Save PNG <span aria-hidden="true">↓</span></button>
      </nav>
    </header>
    <section id="stage" class="stage" aria-label="Drawing area">
      <div id="paper" class="paper">
        <canvas id="drawing" width="1200" height="800" aria-label="Drawing canvas" tabindex="0"></canvas>
        <canvas id="stroke" width="1200" height="800" aria-hidden="true"></canvas>
      </div>
      <div id="empty-hint" class="empty-hint" aria-hidden="true">A little room to draw.<small>Pick a color. Make a mark.</small></div>
      <div id="sample-hint" class="sample-hint" hidden>Tap the page to pick a color</div>
    </section>
    <section class="paintbox" aria-label="Drawing tools">
      <div class="paper-options" role="group" aria-label="Paper color"><span>Paper</span><button data-paper="white" aria-label="White paper" aria-pressed="true">White</button><button data-paper="black" aria-label="Black paper" aria-pressed="false">Black</button><button data-paper="cream" aria-label="Cream paper" aria-pressed="false">Cream</button></div>
      <div class="tool-row">
        <div class="tool-group" aria-label="Tools">
          <button class="tool" data-tool="pen" aria-label="Pen" aria-pressed="true"><span class="tool-symbol" aria-hidden="true">✎</span><span>Pen</span></button>
          <button class="tool" data-tool="marker" aria-label="Marker" aria-pressed="false"><span class="tool-symbol marker-symbol" aria-hidden="true">▰</span><span>Marker</span></button>
          <button class="tool" data-tool="eraser" aria-label="Eraser" aria-pressed="false"><span class="tool-symbol" aria-hidden="true">▱</span><span>Eraser</span></button>
          <button class="tool" id="eyedropper" aria-label="Eyedropper" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5 5 5M13 7 4 16v4h4l9-9m-3-5 4-4 4 4-4 4"/></svg><span>Pick</span></button>
        </div>
        <div class="sizes" aria-label="Brush size">
          <button data-size="0" aria-label="Small brush" aria-pressed="false"><i style="--dot:5px"></i></button>
          <button data-size="1" aria-label="Medium brush" aria-pressed="true"><i style="--dot:11px"></i></button>
          <button data-size="2" aria-label="Large brush" aria-pressed="false"><i style="--dot:20px"></i></button>
        </div>
        <div class="history-actions">
          <button id="undo" aria-label="Undo" title="Undo (Ctrl+Z)" disabled>↶</button>
          <button id="redo" aria-label="Redo" title="Redo (Ctrl+Y)" disabled>↷</button>
          <button id="clear" aria-label="Clear page">Clear</button>
        </div>
      </div>
      <div class="palette-row">
        <div id="palette" class="palette" aria-label="Preset colors"></div>
        <button id="custom-swatch" class="swatch custom-swatch" aria-label="Use custom color" title="Use custom color"><span></span></button>
        <button id="custom-color" class="custom-button" aria-label="Custom color"><span class="wheel-icon" aria-hidden="true"></span><span>Color wheel</span></button>
      </div>
    </section>
    <footer class="statusbar"><span id="status" role="status" aria-live="polite">Ready to draw</span><span id="draft-status">New page</span></footer>
  </main>
  <dialog id="color-dialog" aria-labelledby="color-title">
    <form method="dialog" id="color-form">
      <header class="dialog-header"><div><h2 id="color-title">Find your color</h2><p>A little brighter. A little bolder.</p></div><div class="color-preview"><span id="color-preview"></span></div></header>
      <div class="picker-body">
        <div class="hue-wrap"><canvas id="hue-wheel" width="280" height="280" aria-label="Hue wheel"></canvas><span id="hue-cursor"></span><div class="wheel-center"><span id="hex-preview">#1c2536</span><small>Hue</small></div></div>
        <div class="sliders">
          <label for="hue">Hue <output id="hue-value"></output></label><input id="hue" type="range" min="0" max="359" value="220" aria-label="Hue">
          <label for="saturation">Saturation <output id="saturation-value"></output></label><input id="saturation" type="range" min="0" max="100" value="67" aria-label="Saturation">
          <label for="brightness">Brightness <output id="brightness-value"></output></label><input id="brightness" type="range" min="0" max="100" value="20" aria-label="Brightness">
          <label for="opacity">Opacity <output id="opacity-value"></output></label><input id="opacity" type="range" min="0" max="100" value="100" aria-label="Opacity">
          <label class="hex-label" for="hex">Hex color <input id="hex" type="text" maxlength="7" pattern="#[0-9a-fA-F]{6}" spellcheck="false" autocomplete="off" aria-label="Hex color"></label>
        </div>
      </div>
      <footer class="dialog-actions"><button value="cancel" id="color-cancel" formnovalidate>Cancel</button><button type="button" id="color-apply" class="primary">Use color</button></footer>
    </form>
  </dialog>
  <dialog id="clear-dialog" aria-labelledby="clear-title"><h2 id="clear-title">Start a fresh page?</h2><p>You can undo this if you change your mind.</p><div class="dialog-actions"><button id="clear-cancel">Keep drawing</button><button id="clear-confirm" class="primary">Clear drawing</button></div></dialog>
  <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
</body>
</html>
